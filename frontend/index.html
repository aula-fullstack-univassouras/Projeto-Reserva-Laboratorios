<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplicação didática para gestão de reservas de laboratórios.">
  <title>Reservas de Laboratórios</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="container">
  <header><p class="eyebrow">PROJETO FULL STACK</p><h1>Reservas de Laboratórios</h1><p>Cadastre, consulte, filtre, edite e remova reservas.</p><p id="api-status" role="status" aria-live="polite">Verificando API…</p></header>
  <section class="panel"><h2 id="form-title">Nova reserva</h2><p id="msg" role="status" aria-live="polite"></p>
    <form id="form"><input id="id" type="hidden">
      <label for="laboratorio">Laboratório<input id="laboratorio" required minlength="2" maxlength="60" placeholder="Ex.: Laboratório 01"></label>
      <label for="responsavel">Responsável<input id="responsavel" required minlength="2" maxlength="100" placeholder="Nome do responsável"></label>
      <label for="data">Data<input id="data" type="date" required></label>
      <label for="quantidade_alunos">Quantidade de alunos<input id="quantidade_alunos" type="number" min="1" max="40" value="1" required></label>
      <label for="turno">Turno<select id="turno" required><option value="manha">Manhã</option><option value="tarde">Tarde</option><option value="noite">Noite</option></select></label>
      <label class="wide" for="finalidade">Finalidade<input id="finalidade" required minlength="3" maxlength="200" placeholder="Descreva a atividade"></label>
      <label for="status">Status<select id="status" required><option value="confirmada">Confirmada</option><option value="pendente">Pendente</option><option value="cancelada">Cancelada</option></select></label>
      <div class="actions wide"><button type="submit">Salvar reserva</button><button type="button" class="secondary" id="cancelar">Limpar formulário</button></div>
    </form>
  </section>
  <section class="panel"><h2>Reservas cadastradas</h2><div class="filters">
    <label for="busca">Laboratório<input id="busca" placeholder="Digite parte do nome"></label>
    <label for="fstatus">Status<select id="fstatus"><option value="">Todos</option><option value="confirmada">Confirmada</option><option value="pendente">Pendente</option><option value="cancelada">Cancelada</option></select></label>
    <button type="button" id="filtrar">Aplicar filtros</button>
  </div><div class="table-wrap"><table><thead><tr><th>Laboratório</th><th>Data</th><th>Turno</th><th>Responsável</th><th>Alunos</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div><p id="vazio" hidden>Nenhuma reserva encontrada.</p></section>
  <footer>HTML, CSS, JavaScript, Fetch, FastAPI, Pydantic e SQLite.</footer>
</main><script src="app.js"></script></body></html>
